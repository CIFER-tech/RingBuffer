name: Sync Unity package DLL

on:
  push:
    branches: [main]
    paths:
      - "src/RingBuffer/**"
  workflow_dispatch:

permissions:
  contents: write

# 同時に 2 つ走ると、あとのほうの push が弾かれるので、順番に動かす
concurrency:
  group: sync-unity-dll
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build RingBuffer (Release)
        run: dotnet build src/RingBuffer/RingBuffer.csproj -c Release

      - name: Copy build output into Unity package
        run: |
          cp src/RingBuffer/bin/Release/netstandard2.1/CIFER.tech.RingBuffer.dll Unity/Runtime/CIFER.tech.RingBuffer.dll

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Unity/Runtime/CIFER.tech.RingBuffer.dll
          if git diff --cached --quiet; then
            echo "CIFER.tech.RingBuffer.dll is already up to date."
          else
            git commit -m "chore(unity): sync CIFER.tech.RingBuffer.dll from src/RingBuffer

          Auto-generated by .github/workflows/sync-unity-dll.yml"
            # このジョブのあいだに main が進んでいても、push が弾かれないようにする
            git pull --rebase origin main
            git push
          fi
