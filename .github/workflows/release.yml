name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Unity DLL is synced
        run: |
          # DLL を同期したコミットより前のコミットにタグを付けると、古い DLL が配られる
          src_commit=$(git log -1 --format=%H -- src/RingBuffer)
          dll_commit=$(git log -1 --format=%H -- src/RingBuffer.Unity/Runtime/CIFER.tech.RingBuffer.dll)
          if ! git merge-base --is-ancestor "$src_commit" "$dll_commit"; then
            echo "src/RingBuffer の最後の変更 ($src_commit) が、DLL の最後の同期 ($dll_commit) より新しい。DLL の同期のあとのコミットにタグを付ける。"
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: dotnet test

      - name: Pack
        run: dotnet pack src/RingBuffer/RingBuffer.csproj -c Release -o out

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/*.nupkg --generate-notes --title "$GITHUB_REF_NAME"
